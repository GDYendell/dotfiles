gui:
  # Stack panels whenever width <= 88 cols, regardless of height
  portraitMode: auto
  portraitModeAutoMaxWidth: 88
  portraitModeAutoMinHeight: 0
os:
  editPreset: "nvim"
git:
  allBranchesLogCmds:
    - "git log --all --decorate --oneline --graph --color=always"
  diffRenderers:
    - command: delta --dark --paging=never
keybinding:
  commits:
    moveUpCommit: [<ctrl-up>]
    moveDownCommit: [<ctrl-down>]
